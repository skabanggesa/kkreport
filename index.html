<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Laporan Aktiviti Mingguan Kokurikulum</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="container" id="laporan">
  <img src="logo.png" alt="Logo Sekolah" class="logo">
  <h1>LAPORAN AKTIVITI MINGGUAN KOKURIKULUM</h1>
  <h2>SK ABANG GESA</h2>
  <hr>

  <div class="form-grid">
    <div>
      <label for="tarikh">TARIKH:</label>
      <input type="date" id="tarikh">
    </div>
    <div>
      <label for="tempat">TEMPAT:</label>
      <input type="text" id="tempat" placeholder="Contoh: Padang Sekolah">
    </div>
    <div>
      <label>MASA:</label>
      <input type="text" value="03:00 pm - 05:00 pm" readonly>
    </div>
    <div>
      <label for="kehadiran">JUMLAH KEHADIRAN:</label>
      <input type="number" id="kehadiran" placeholder="Contoh: 35">
    </div>
    <div>
      <label for="organisasi">ORGANISASI:</label>
      <select id="organisasi" onchange="updateGuru()">
        <option value="">-- Pilih --</option>
        <option value="PENGAKAP">PENGAKAP</option>
        <option value="TKRS">TKRS</option>
        <option value="PPIM">PPIM</option>
        <option value="BSMM">BSMM</option>
        <option value="KELAB BAHASA MELAYU">KELAB BAHASA MELAYU</option>
        <option value="KELAB BAHASA INGGERIS">KELAB BAHASA INGGERIS</option>
        <option value="KELAB STEM">KELAB STEM</option>
        <option value="KELAB PENCINTA ALAM">KELAB PENCINTA ALAM</option>
        <option value="KELAB SENI DAN KEBUDAYAAN">KELAB SENI DAN KEBUDAYAAN</option>
        <option value="KELAB PENDIDIKAN ISLAM">KELAB PENDIDIKAN ISLAM</option>
        <option value="KELAB SPBT">KELAB SPBT</option>
        <option value="BOLA SEPAK">BOLA SEPAK</option>
        <option value="HOKI">HOKI</option>
        <option value="BOLA JARING">BOLA JARING</option>
        <option value="OLAHRAGA">OLAHRAGA</option>
        <option value="MEMANAH">MEMANAH</option>
        <option value="PINGPONG">PINGPONG</option>
      </select>
    </div>
    <div>
      <label for="guru">GURU PENASIHAT:</label>
      <textarea id="guru" rows="8" readonly></textarea>
    </div>
  </div>

  <div class="laporan">
    <label for="aktiviti">LAPORAN AKTIVITI:</label>
    <textarea id="aktiviti" rows="6" placeholder="• " oninput="autoBullet(this)"></textarea>
  </div>

  <hr>

</div>

<div class="buttons">
  <button onclick="window.print()">CETAK LAPORAN</button>
  <button onclick="tambah()">TAMBAH LAPORAN</button>
  <button onclick="padam()">PADAM LAPORAN</button>
  <button onclick="handleAuthClick()">LOGIN GOOGLE</button>
  <button onclick="uploadToDrive()">UPLOAD KE GOOGLE DRIVE</button>
</div>

<script src="script.js"></script>

</body>
</html>
